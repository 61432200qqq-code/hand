<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оракул Хиромантии — Чтение Линий</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Georgia', serif;
    background: #0a0618;
    color: #e8d9a8;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  .bg {
    position: fixed; inset: 0; z-index: -3;
    background: radial-gradient(ellipse at 20% 30%, rgba(80,40,120,0.4), transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(120,80,40,0.3), transparent 50%),
                linear-gradient(180deg, #0a0618 0%, #1a0f3d 50%, #0a0618 100%);
  }
  .stars {
    position: fixed; inset: 0; z-index: -2;
    background-image: radial-gradient(1px 1px at 50px 80px, white, transparent),
                      radial-gradient(1px 1px at 150px 40px, white, transparent),
                      radial-gradient(1.2px 1.2px at 280px 120px, white, transparent);
    background-size: 500px 400px;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:0.7;} 50%{opacity:1;} }
  .mist {
    position: fixed; bottom:0; left:0; width:100%; height:40%;
    background: linear-gradient(to top, rgba(80,60,120,0.4), transparent);
    filter: blur(20px); z-index: -1;
  }

  .container {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 60px;
  }
  .header-title {
    font-size: 28px; letter-spacing: 3px; color: #c9a86a;
    text-shadow: 0 0 20px rgba(201,168,106,0.8);
    margin-bottom: 30px; text-align: center; font-style: italic;
  }
  .frame {
    position: relative; padding: 30px;
    background: linear-gradient(135deg, #8a6a30 0%, #d4a850 25%, #8a6a30 50%, #d4a850 75%, #8a6a30 100%);
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(201,168,106,0.4), inset 0 0 30px rgba(0,0,0,0.5);
    max-width: 700px; width: 100%;
  }
  .frame::before { content: '☽ ✦ ☾'; position: absolute; top: 8px; left: 50%;
    transform: translateX(-50%); color: #2a1f3d; font-size: 18px; letter-spacing: 15px; }
  .corner { position: absolute; width: 30px; height: 30px; border: 3px solid #2a1f3d; }
  .corner.tl { top:15px; left:15px; border-right:none; border-bottom:none; }
  .corner.tr { top:15px; right:15px; border-left:none; border-bottom:none; }
  .corner.bl { bottom:15px; left:15px; border-right:none; border-top:none; }
  .corner.br { bottom:15px; right:15px; border-left:none; border-top:none; }

  .board {
    background: linear-gradient(135deg, #1a0f3d 0%, #2a1f5d 50%, #1a0f3d 100%);
    border: 2px solid #3a2a5d; border-radius: 4px;
    padding: 30px; min-height: 350px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
  }
  .board::before { content:''; position:absolute; inset:0;
    background: radial-gradient(ellipse at center, rgba(100,80,180,0.2), transparent 70%);
    animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  .prompt {
    font-size: 24px; text-align: center; color: #f0e6c0;
    text-shadow: 0 0 15px rgba(240,230,192,0.6);
    line-height: 1.4; position: relative; z-index: 2;
    font-style: italic; margin-bottom: 25px;
  }

  .upload-zone {
    position: relative; z-index: 2;
    border: 2px dashed #8a7040; border-radius: 8px;
    padding: 30px 20px; text-align: center; width: 100%;
    cursor: pointer; transition: all 0.3s; background: rgba(10,6,24,0.3);
  }
  .upload-zone:hover { background: rgba(138,112,64,0.1); border-color: #d4a850; }
  .upload-icon { font-size: 40px; color: #d4a850; margin-bottom: 10px; }
  .file-input { display: none; }

  .image-wrapper {
    position: relative; z-index: 2;
    max-width: 100%; margin-top: 20px;
    border: 2px solid #8a7040; border-radius: 4px;
    overflow: hidden; display: none;
    box-shadow: 0 0 30px rgba(212,168,80,0.3);
  }
  .image-wrapper img {
    max-width: 100%; max-height: 400px; display: block;
    filter: contrast(1.1);
  }
  
  /* Зоны сканирования */
  .scan-zone {
    position: absolute; border: 2px solid #00ffff;
    background: rgba(0, 255, 255, 0.1);
    box-shadow: 0 0 10px #00ffff, inset 0 0 10px #00ffff;
    display: none; animation: scanPulse 1s infinite;
  }
  @keyframes scanPulse { 0%,100%{opacity:0.3;} 50%{opacity:0.8;} }

  .result {
    position: relative; z-index: 2;
    text-align: left; max-width: 100%;
    line-height: 1.6; font-size: 15px;
    color: #f0e6c0; display: none; width: 100%;
    margin-top: 25px;
  }
  .result.show { display: block; animation: fadeIn 1.5s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
  .result h2 {
    text-align: center; color: #d4a850; font-size: 22px;
    margin-bottom: 15px; text-shadow: 0 0 10px rgba(212,168,80,0.5);
  }
  .result h3 {
    color: #e8c9a8; font-size: 17px;
    margin: 15px 0 8px; text-shadow: 0 0 8px rgba(232,201,168,0.4);
    border-bottom: 1px solid #8a60a0; padding-bottom: 4px;
  }
  .result .section {
    margin: 10px 0; padding: 12px 15px;
    border-left: 3px solid #8a60a0;
    background: rgba(30,20,60,0.4); border-radius: 0 4px 4px 0;
  }
  .result .section strong { color: #e8c9a8; }
  .btn-reset {
    background: linear-gradient(135deg, #3a2a5d, #6a4a9d, #3a2a5d);
    border: 2px solid #8a7040; color: #f0e6c0;
    padding: 10px 25px; font-size: 16px;
    font-family: 'Georgia', serif; cursor: pointer;
    border-radius: 4px; margin-top: 20px; transition: all 0.3s;
  }
  .btn-reset:hover { box-shadow: 0 0 20px rgba(106,74,157,0.7); transform: scale(1.05); }
  .error { color: #ff8080; text-align: center; margin-top: 15px; position: relative; z-index: 2; font-style: italic; }

  @media (max-width: 768px) {
    .container { padding: 20px; }
    .frame { padding: 20px; }
    .board { padding: 20px; }
    .prompt { font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="stars"></div>
  <div class="mist"></div>

  <div class="container">
    <div class="header-title">✦ ОРАКУЛ ХИРОМАНТИИ ✦</div>

    <div class="frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      
      <div class="board">
        <div class="prompt" id="prompt">
          Загрузите фото ладони.<br>Алгоритм считает ваши линии.
        </div>
        
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">🖐️</div>
          <p>Нажмите, чтобы выбрать фото<br>(ладонь должна быть хорошо освещена)</p>
          <input type="file" id="fileInput" class="file-input" accept="image/*">
        </div>

        <div class="image-wrapper" id="imageWrapper">
          <img id="previewImg" src="" alt="Рука">
          <!-- Зоны сканирования -->
          <div class="scan-zone" id="zoneHeart" style="top:20%; left:10%; width:80%; height:15%;"></div>
          <div class="scan-zone" id="zoneHead" style="top:38%; left:10%; width:80%; height:15%;"></div>
          <div class="scan-zone" id="zoneLife" style="top:40%; left:5%; width:45%; height:50%;"></div>
          <div class="scan-zone" id="zoneFate" style="top:30%; left:40%; width:20%; height:60%;"></div>
        </div>

        <div class="error" id="error"></div>
        <div class="result" id="result"></div>
      </div>
    </div>
  </div>

  <canvas id="analysisCanvas" style="display:none;"></canvas>

<script>
const fileInput = document.getElementById('fileInput');
const previewImg = document.getElementById('previewImg');
const imageWrapper = document.getElementById('imageWrapper');
const resultDiv = document.getElementById('result');
const errorDiv = document.getElementById('error');
const canvas = document.getElementById('analysisCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function handleFile(file) {
  errorDiv.textContent = '';
  resultDiv.classList.remove('show');
  resultDiv.innerHTML = '';
  
  if (!file.type.startsWith('image/')) {
    errorDiv.textContent = '✦ Это не изображение ✦';
    return;
  }

  const reader = new FileReader();
  reader.onload = (event) => {
    previewImg.src = event.target.result;
    document.getElementById('uploadZone').style.display = 'none';
    document.getElementById('prompt').style.display = 'none';
    imageWrapper.style.display = 'block';
    
    // Показываем зоны сканирования
    const zones = document.querySelectorAll('.scan-zone');
    zones.forEach(z => z.style.display = 'block');
    
    setTimeout(() => analyzeLines(event.target.result), 2500);
  };
  reader.readAsDataURL(file);
}

function analyzeLines(imgSrc) {
  const img = new Image();
  img.onload = () => {
    // Приводим к стандартному размеру для анализа
    const w = 300, h = 400;
    canvas.width = w; canvas.height = h;
    ctx.drawImage(img, 0, 0, w, h);
    
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    // Функция анализа зоны: считает плотность темных пикселей (линий)
    function scanZone(x, y, zoneW, zoneH) {
      let darkPixels = 0;
      let totalPixels = zoneW * zoneH;
      let breaks = 0;
      let prevRowDark = false;

      for (let i = y; i < y + zoneH; i++) {
        let rowDark = false;
        for (let j = x; j < x + zoneW; j++) {
          const idx = (i * w + j) * 4;
          // Яркость пикселя (линии темнее кожи)
          const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
          if (brightness < 110) { 
            darkPixels++; 
            rowDark = true; 
          }
        }
        if (prevRowDark && !rowDark) breaks++;
        prevRowDark = rowDark;
      }
      
      const density = (darkPixels / totalPixels) * 100; // Глубина/насыщенность
      const continuity = Math.max(0, 100 - (breaks * 2)); // Непрерывность
      return { density, continuity };
    }

    // Сканируем 4 главные линии (проценты от размера 300x400)
    const heart = scanZone(30, 80, 240, 60);   // Линия Сердца
    const head = scanZone(30, 150, 240, 60);   // Линия Головы
    const life = scanZone(15, 160, 135, 200);  // Линия Жизни
    const fate = scanZone(120, 120, 60, 240);  // Линия Судьбы

    generateReading(heart, head, life, fate);
  };
  img.src = imgSrc;
}

function generateReading(heart, head, life, fate) {
  // Динамическая генерация текста на основе РЕАЛЬНЫХ пикселей
  function interpret(name, metrics, type) {
    let text = "";
    const d = metrics.density;
    const c = metrics.continuity;

    // Анализ глубины
    if (d > 45) text += `Линия ${name} глубокая, четкая и хорошо выраженная. `;
    else if (d > 20) text += `Линия ${name} имеет среднюю глубину, умеренно выражена. `;
    else text += `Линия ${name} тонкая, едва уловимая, требует внимания. `;

    // Анализ непрерывности
    if (c > 80) text += "Она проходит ровно, без разрывов, что говорит о стабильности. ";
    else if (c > 50) text += "Присутствуют небольшие островки и изменения направления. ";
    else text += "Линия прерывистая, с заметными разрывами, указывающими на перемены. ";

    // Специфика типа линии
    if (type === 'heart') {
      if (d > 40 && c > 70) text += "Вы любите глубоко, преданно и без колебаний. Эмоциональный фон устойчив.";
      else if (d < 20) text += "Вы осторожны в чувствах, склонны к рациональному восприятию любви.";
      else text += "Ваши эмоции переменчивы, вы ищете баланс между разумом и сердцем.";
    } else if (type === 'head') {
      if (d > 40 && c > 70) text += "У вас мощный аналитический ум, способность к концентрации и логике.";
      else if (d < 20) text += "Ваше мышление образное, интуитивное, вы избегаете жестких рамок.";
      else text += "Гибкий ум, способность адаптироваться, но иногда сложно сосредоточиться.";
    } else if (type === 'life') {
      if (d > 40 && c > 70) text += "Огромный запас жизненной силы, крепкий иммунитет и устойчивость к кризисам.";
      else if (d < 20) text += "Энергия требует бережного отношения. Вам важно следить за режимом и восстановлением.";
      else text += "Жизненная сила волнообразна: периоды подъема сменяются необходимостью отдыха.";
    } else if (type === 'fate') {
      if (d > 30 && c > 60) text += "Вы сами кузнец своего счастья, четко видите цель и идете к ней.";
      else if (d < 15) text += "Судьба не диктует жестких рамок. Вы свободны в выборе пути, но ответственность только на вас.";
      else text += "Ваш путь нелинеен. Вы часто меняете направления, адаптируясь к обстоятельствам.";
    }
    return text;
  }

  const html = `
    <h2>✦ КАРТА ВАШЕЙ СУДЬБЫ ✦</h2>
    <div class="section">
      <strong>Линия Сердца (Эмоции):</strong> ${interpret('Сердца', heart, 'heart')}
    </div>
    <div class="section">
      <strong>Линия Головы (Интеллект):</strong> ${interpret('Головы', head, 'head')}
    </div>
    <div class="section">
      <strong>Линия Жизни (Энергия):</strong> ${interpret('Жизни', life, 'life')}
    </div>
    <div class="section">
      <strong>Линия Судьбы (Путь):</strong> ${interpret('Судьбы', fate, 'fate')}
    </div>
    <div class="section" style="border-left-color: #d4a850; background: rgba(40,30,70,0.6);">
      <strong>Совет Оракула:</strong> ${getAdvice(heart, head, life, fate)}
    </div>
    <button class="btn-reset" onclick="location.reload()">Прочитать другую руку</button>
  `;

  document.querySelectorAll('.scan-zone').forEach(z => z.style.display = 'none');
  resultDiv.innerHTML = html;
  resultDiv.classList.add('show');
}

function getAdvice(h, hd, l, f) {
  const total = h.density + hd.density + l.density + f.density;
  if (total > 120) return "Ваши линии глубоки и сильны. Вы обладаете мощным потенциалом, но избегайте упрямства. Направляйте силу на созидание.";
  if (total < 60) return "Ваши линии тонки и деликатны. Вы тонко чувствуете мир. Избегайте грубой силы, ваш путь — через интуицию и мягкость.";
  return "Ваша карта сбалансирована. У вас есть и сила, и гибкость. Главное — не распыляться и выбрать одно главное направление.";
}
</script>
</body>
</html>
